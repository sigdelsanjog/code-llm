model:
  size: small
data:
  train_data: train.npy
  val_data: val.npy
training:
  num_epochs: 20
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 100
optimizer:
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
checkpointing:
  checkpoint_dir: ./checkpoints
  save_interval: 200
  keep_last_n: 3
logging:
  log_dir: ./logs
  eval_interval: 200
  log_interval: 10
device:
  device: cuda
  seed: 42
advanced:
  max_steps: 20000
  resume_from: ./checkpoints/final_model.pt
  quick_test: false
